name: CI - eCAD-Hardware-Products

on:
  push:
    branches: [master, develop]
    tags: ["v*"]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-22.04, macos-latest, windows-2022]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/requirements.txt
          python -m pip install pytest mypy ruff

      - name: Lint (ruff)
        run: ruff check . --select=E,F,W --ignore=E501
        continue-on-error: true

      - name: Type check (mypy)
        run: mypy . --ignore-missing-imports --no-strict-optional
        continue-on-error: true

      - name: Run complete test suite
        run: python run_all_tests.py --tb=short

  validation-evidence:
    name: Execute complete V0-V4 evidence run
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/requirements.txt

      - name: Execute every inventoried product
        run: >-
          python tools/validate_products.py validate --all
          --output validation-output --mode evidence

      - name: Independently verify emitted bundle
        run: >-
          python tools/validate_products.py verify-bundle
          validation-output/bundle.json

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecad-validation-${{ github.sha }}
          path: validation-output/
          if-no-files-found: error

  cad-dataset:
    name: CAD dataset extraction and V0-V4
    runs-on: ubuntu-22.04
    env:
      # The dataset tests skip without the CAD kernel; here a skip is a failure.
      ECAD_REQUIRE_CAD_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/requirements.txt
            tools/requirements-cad.txt

      - name: Install the CAD kernel and simulator
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/requirements.txt -r tools/requirements-cad.txt pytest

      - name: Complete test suite, CAD tests mandatory
        run: python run_all_tests.py --tb=short

      - name: Committed derivation reproduces from the CAD
        run: python tools/cad_dataset.py check datasets/cad/robotic_joint_001

      - name: V0-V4 receipt
        run: >-
          python tools/cad_dataset.py validate datasets/cad/robotic_joint_001
          --output dataset-validation

      - name: Upload dataset evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-dataset-${{ github.sha }}
          path: dataset-validation/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    needs: [test, validation-evidence]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
